# =============================================================================
# czitools — standalone Pixi environment
#
# Creates a self-contained environment for developing and testing czitools
# including all optional extras ([all], [omezarr], [omezarr-gui]).
#
# Usage:
#   pixi install            – resolve & install everything
#   pixi run test           – run the test suite
#   pixi run test-no-net    – run tests excluding network-dependent ones
#   pixi run start-napari   – open Napari
# =============================================================================

[workspace]
authors = ["Rhode, Sebastian <sebrhode@gmail.com>"]
channels = ["conda-forge"]
name = "czitools"
platforms = ["win-64", "linux-64"]
version = "0.20.1"
description = "Tools for reading CZI pixel data and metadata and converting CZI data to OME-Zarr."

# =============================================================================
# CONDA-FORGE dependencies
#
# Prefer conda for packages that ship compiled C / Fortran extensions so that
# ABI compatibility with the conda runtime is guaranteed.
# =============================================================================
[dependencies]
python = "3.12.*"

# --- Scientific computing stack ----------------------------------------------
numpy        = "*"
scipy        = "*"
dask         = "*"
dask-image   = "*"
xarray       = ">=2026.2.0"
pandas       = "<3"
scikit-image = ">=0.26.0"

# --- Visualisation -----------------------------------------------------------
# Use the backend-neutral package: the `matplotlib` conda metapackage pulls
# PyQt5 on Linux, conflicting with the PyQt6 backend selected below.
matplotlib-base = ">=3.7.0"
seaborn      = ">=0.13.2"
colormap     = "*"

# --- Storage & I/O -----------------------------------------------------------
zarr         = ">=3.0"
fsspec       = "*"
requests     = "*"
imagecodecs  = ">=2026.6.6"  # required by czifile >=2026.6.6; keep compiled codecs on conda-forge

# --- Qt wrappers & widgets ----------------------------------------------------
# PyQt6 is selected per platform below. The PyPI wheel is used on Linux to
# avoid conda Qt's GLX libraries conflicting with the host Mesa driver.
qtpy         = "*"
pyqtgraph    = "*"

# --- Data validation ---------------------------------------------------------
pydantic     = "*"
ome-zarr-models = ">=1.7,<2"

# --- Logging & progress ------------------------------------------------------
colorlog     = "*"
tqdm         = "*"
progressbar2 = "*"
python-dateutil = "*"

# --- Dev / testing -----------------------------------------------------------
ipykernel    = ">=5.2.0,<7"
ipyfilechooser = "*"
pytest       = "*"
pytest-cov   = "*"
ruff         = ">=0.9.4"
setuptools   = "*"
wheel        = "*"
validators   = "*"

[target.win-64.dependencies]
pyqt6 = ">=6.7, !=6.11.0, !=6.11.1"  # conda build avoids Windows DLL conflicts

[target.linux-64.pypi-dependencies]
pyqt6 = ">=6.7, !=6.11.0, !=6.11.1"  # bundled Qt works with the host GLX/Mesa stack

# =============================================================================
# PyPI dependencies
#
# Packages only available on PyPI or where the conda-forge version is
# incompatible.  pixi reads pyproject.toml for the editable install and
# skips packages already satisfied by conda above.
# =============================================================================
[pypi-dependencies]

# --- Self (editable install) -------------------------------------------------
czitools = { path = ".", editable = true }

# --- czitools core (PyPI-only) -----------------------------------------------
pylibCZIrw   = ">=6"
python-box   = { version = "*", extras = ["all"] }
loguru       = "*"
czifile      = ">=2026.6.6"

# --- Optional extras: [all] --------------------------------------------------
plotly       = "*"
napari       = ">=0.8.0"
magicgui     = "*"
superqt      = "*"
napari-ome-zarr = ">=0.8.0"
ndv          = { version = ">=0.5.0", extras = ["vispy", "pyqt"] }

# --- Optional extras: [omezarr] ----------------------------------------------
ngff-zarr    = ">=0.39.0"
ome-zarr     = ">=0.16.0"

# --- BioIO ecosystem ---------------------------------------------------------
bioio        = "*"
bioio-czi    = "*"
bioio-ome-zarr = "*"
aicspylibczi = ">=3.3.1"

# --- Network / certificates --------------------------------------------------
pip-system-certs = "*"

# =============================================================================
# Activation
# =============================================================================
[activation]
env = { QT_API = "pyqt6", SSL_CERT_DIR = "" }

# =============================================================================
# Tasks
# =============================================================================
[tasks]
test         = { cmd = "pytest src/czitools/_tests/ -v", depends-on = ["verify-qt-backend"], description = "Run the full test suite" }
test-no-net  = { cmd = "pytest src/czitools/_tests/ -v -m 'not network'", depends-on = ["verify-qt-backend"], description = "Run tests excluding network-dependent ones" }
lint         = { cmd = "ruff check src demo/scripts", description = "Run correctness-focused Ruff checks" }
verify-qt-backend = { cmd = "python -c \"import importlib.util as iu; pyqt5 = iu.find_spec('PyQt5'); assert pyqt5 is None or iu.find_spec('PyQt5.QtCore') is None, 'PyQt5 must not be installed'; import qtpy; assert qtpy.API_NAME == 'PyQt6', qtpy.API_NAME; print('Qt backend: PyQt6 (PyQt5 absent)')\"", description = "Verify that PyQt6 is selected and PyQt5 is not installed" }
start-napari = { cmd = "napari", depends-on = ["verify-qt-backend"], description = "Open the Napari viewer" }
omezarr-gui   = { cmd = "czitools-omezarr-gui", depends-on = ["verify-qt-backend"], description = "Open the OME-Zarr GUI" }
