[build-system]
requires = ["setuptools>=77", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "czitools"
dynamic = ["version"]
description = "Tools for reading CZI pixel data and metadata and converting CZI data to OME-Zarr"
readme = "README.md"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
authors = [
    {name = "Sebastian Rhode", email = "sebrhode@gmail.com"}
]
requires-python = ">=3.12, <3.14"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: Unix",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
]
dependencies = [
    "pylibCZIrw>=5",
    "progressbar2",
    "numpy",
    "pandas",
    "python-dateutil",
    "python-box[all]",
    "czifile>=2026.6.6",
    "loguru",
    "colorlog",
    "pydantic",
    "xarray",
    "dask[array]",
    "requests",
    "validators",
    "zarr>=3.0",
    "matplotlib",
    "rich",
]

[project.optional-dependencies]
all = [
    "seaborn",
    "plotly",
    "qtpy",
    "pyqtgraph",
    "cmap",
    "ngff-zarr[dask-image,validate]>=0.45.0",
    "ome-zarr>=0.18.0",
    "ome-zarr-models>=1.7,<2",
    "magicgui",
    "napari>=0.9.0",
    "napari-ome-zarr>=0.10.0",
    "bioio",
    "bioio-czi",
    "bioio-ome-zarr",
    "ndv[pyqt,vispy]",
    "scikit-image",
]
# OME-Zarr / OME-NGFF export (czitools.export_tools): conversion + validation.
omezarr = [
    "ngff-zarr[cli, dask-image,validate]>=0.45.0",
    "ome-zarr>=0.18.0",
    "ome-zarr-models>=1.8,<2",
]
# OME-Zarr export plus the MagicGUI converter application.
omezarr-gui = [
    "czitools[omezarr]",
    "magicgui",
    "qtpy",
    "napari>=0.9.0",
    "napari-ome-zarr>=0.10.0",
]
# HCS analysis + plate visualization (czitools.analysis_tools).
#   process_hcs_omezarr reads HCS OME-Zarr via ngff-zarr (hence czitools[omezarr]).
analysis = [
    "czitools[omezarr]",
    "scikit-image",
    "seaborn",
    "matplotlib",
]
docs = [
    "mkdocs-autorefs",
    "pymdown-extensions",
    "mkdocs >=1.6.1",
    "mkdocs-api-autonav >=0.1.2",
    "mkdocs-material >=9.5.49",
    "mkdocs-minify-plugin >=0.8.0",
    "mkdocs-spellcheck[codespell] ==1.1.0",
    "mkdocstrings-python >=1.13.0",
    "mike >=2.1.3",
    "ruff>=0.9.4",
    "cmap",
    "ndv",
    "matplotlib",
    "plotly",
    # Installed so the auto-generated czitools.export_tools API pages resolve
    # signature type references during the docs build.
    "ngff-zarr>=0.45.0",
    "ome-zarr>=0.18.0",
    "zarr>=3.0",
    "ome-zarr-models>=1.8,<2",
    "magicgui",
    "qtpy",
]

[project.urls]
"Bug Tracker" = "https://github.com/sebi06/czitools/issues"
"Documentation" = "https://sebi06.github.io/czitools/"
"Source Code" = "https://github.com/sebi06/czitools/"
"User Support" = "https://github.com/sebi06/czitools/issues"

[project.scripts]
czitools-omezarr-gui = "czitools.export_tools.gui:run_gui"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
exclude = ["czitools._tests*", "data*", "docs*", "demo*", "images*", "archive*"]

[tool.setuptools.exclude-package-data]
"czitools._tests" = ["*"]

[tool.setuptools.package-data]
"*" = [
    "*.czi",
    "*.tif",
    "*.tiff",
    "*.csv",
    "*.html",
    "*.zarr",
    "*MetaData.xml",
]

[tool.setuptools_scm]
version_file = "src/czitools/_version.py"

[tool.pytest.ini_options]
testpaths = ["src/czitools/_tests"]
pythonpath = ["src"]
norecursedirs = [".git", ".vscode", "demo", ".idea"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "--ignore=old/napari_tools/test_napari_tools.py"
markers = [
    "network: marks tests that require network connectivity (deselect with '-m \"not network\"')",
]

[tool.ruff]
target-version = "py312"
line-length = 120
extend-exclude = ["build", "old"]

[tool.ruff.lint]
# Keep the release gate focused on syntax, imports, and definite runtime errors.
# Broader modernization rules can be adopted incrementally after 0.20.0.
select = ["E4", "E7", "E9", "F"]

[tool.marimo.runtime]
pythonpath = ["src"]
